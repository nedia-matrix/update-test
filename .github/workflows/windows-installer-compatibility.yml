name: Windows installer compatibility

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/desktop/package.json
      - apps/tauri/run.mjs
      - scripts/package/build-tauri-nsis.mjs
      - scripts/package/windows-installer.*
      - scripts/package/test/windows-installer.test.mjs
      - scripts/package/check-windows-installer.*
      - .github/workflows/windows-installer-compatibility.yml
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  nsis:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test installer preflight with inherited PowerShell module paths
        run: node --test scripts/package/test/windows-installer.test.mjs
      - name: Verify both installer scopes and shell transitions with isolated native fixtures
        run: node scripts/package/check-windows-installer.mjs
        env:
          NEDIA_VERIFY_NSIS_INSTALL: "1"
