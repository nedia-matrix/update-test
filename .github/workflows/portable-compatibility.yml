name: Portable compatibility verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - apps/tauri/portable/**
      - apps/desktop/installer/**
      - scripts/package/build-tauri-portable.mjs
      - scripts/package/test/tauri-portable.test.mjs
      - .github/workflows/portable-compatibility.yml
      - package.json
      - pnpm-lock.yaml

permissions:
  contents: read

jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.18.0
          cache: pnpm
      - uses: actions/setup-go@v6
        with:
          go-version-file: apps/tauri/portable/go.mod
          cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Test dependency preflight, resource guards, and original launcher replacement
        working-directory: apps/tauri/portable
        run: go test ./...
      - name: Verify single EXE and legacy product metadata
        env:
          NEDIA_VERIFY_PORTABLE_BUILD: "1"
        run: node --test scripts/package/test/tauri-portable.test.mjs
